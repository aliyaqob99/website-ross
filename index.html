<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosa Makup</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #06040d;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-container {
            margin-bottom: 20px;
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: contain;
            border: 2px solid rgba(168, 85, 247, 0.7);
            background-color: #ffffff;
            padding: 4px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
        }

        .name {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .btn-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            width: 100%;
            padding: 15px 20px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(168, 85, 247, 0.25);
            border-color: #a855f7;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(168, 85, 247, 0.4);
        }

        /* إيماء يختفي ويظهر بالتدريج للنص السفلي */
        .footer-text {
            font-size: 0.95rem;
            color: #d0d0e0;
            font-weight: 400;
            animation: pulseFade 3s ease-in-out infinite;
        }

        @keyframes pulseFade {
            0% {
                opacity: 0.2;
                transform: scale(0.98);
            }
            50% {
                opacity: 1;
                transform: scale(1.02);
                text-shadow: 0 0 10px rgba(168, 85, 247, 0.8);
            }
            100% {
                opacity: 0.2;
                transform: scale(0.98);
            }
        }
    </style>
</head>
<body>

    <canvas id="starCanvas"></canvas>

    <div class="container">
        <div class="profile-container">
            <img src="logo.png" alt="Rosa Logo" class="profile-img">
        </div>

        <h1 class="name">Rosa Makup</h1>

        <div class="btn-group">
            <a href="https://wa.me/9640000000000" class="btn" target="_blank">
                <i class="fab fa-whatsapp"></i> Whatsapp
            </a>
            <a href="https://www.facebook.com/" class="btn" target="_blank">
                <i class="fab fa-facebook-f"></i> Facebook
            </a>
            <a href="https://www.instagram.com/" class="btn" target="_blank">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="tel:07700000000" class="btn">
                <i class="fas fa-phone"></i> Call Al-Mansour
            </a>
            <a href="tel:07700000000" class="btn">
                <i class="fas fa-phone"></i> Call Al-Adhamiya
            </a>
        </div>

        <p class="footer-text">RosaMakupIQ❤️</p>
    </div>

    <script>
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // 1. توليد حقل النجوم المتحركة لليسار
        const stars = [];
        const numStars = 300;

        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.3 + 0.2,
                speed: Math.random() * 0.4 + 0.1, // حركة هادئة وبطيئة لليسار
                alpha: Math.random() * 0.8 + 0.2
            });
        }

        // 2. توليد نيازك احترافية مع ذيل وهالة ضوئية
        const meteors = [];

        function createMeteor() {
            const startX = Math.random() * (width + 200);
            const startY = Math.random() * (height * 0.5) - 50;
            const angle = Math.PI / 4 + (Math.random() * 0.1 - 0.05); // زاوية انحدار متناسقة

            meteors.push({
                x: startX,
                y: startY,
                length: Math.random() * 120 + 80,
                speed: Math.random() * 8 + 6,
                angle: angle,
                alpha: 1,
                decay: Math.random() * 0.008 + 0.006,
                headRadius: Math.random() * 1.5 + 1.2
            });
        }

        // إطلاق نيزك كل ثانيتين
        setInterval(() => {
            if (meteors.length < 3 && Math.random() < 0.8) {
                createMeteor();
            }
        }, 2000);

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // --- رسم وحركة النجوم نحو اليسار ---
            stars.forEach(star => {
                star.x -= star.speed;

                if (star.x < 0) {
                    star.x = width;
                    star.y = Math.random() * height;
                }

                ctx.fillStyle = rgba(255, 255, 255, ${star.alpha});
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // --- رسم النيازك الاحترافية ذوات الذيل المضيء ---
            for (let i = meteors.length - 1; i >= 0; i--) {
                const m = meteors[i];

                m.x -= Math.cos(m.angle) * m.speed;
                m.y += Math.sin(m.angle) * m.speed;
                m.alpha -= m.decay;

                if (m.alpha <= 0 || m.x < -150 || m.y > height + 150) {
                    meteors.splice(i, 1);
                    continue;
                }

                const tailX = m.x + Math.cos(m.angle) * m.length;
                const tailY = m.y - Math.sin(m.angle) * m.length;

                // ذيل متدرج الضوء واللون للنيزك
                const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
                grad.addColorStop(0, rgba(255, 255, 255, ${m.alpha}));
                grad.addColorStop(0.2, rgba(216, 180, 254, ${m.alpha * 0.8}));
                grad.addColorStop(1, 'rgba(147, 51, 234, 0)');

                ctx.strokeStyle = grad;
                ctx.lineWidth = m.headRadius;
                ctx.lineCap = 'round';

                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(tailX, tailY);
                ctx.stroke();

                // توهج رأس النيزك (Glow Effect)
                ctx.fillStyle = rgba(255, 255, 255, ${m.alpha});
                ctx.shadowColor = '#c084fc';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(m.x, m.y, m.headRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0; // إعادة تعيين التوهج
            }

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
