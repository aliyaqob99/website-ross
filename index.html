<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosa Makup</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #06040d;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-container {
            margin-bottom: 20px;
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: contain;
            border: 2px solid rgba(168, 85, 247, 0.7);
            background-color: #ffffff;
            padding: 4px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
        }

        .name {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .btn-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            width: 100%;
            padding: 15px 20px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(168, 85, 247, 0.25);
            border-color: #a855f7;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(168, 85, 247, 0.4);
        }

        .footer-text {
            font-size: 0.95rem;
            color: #d0d0e0;
            font-weight: 400;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div class="container">
        <div class="profile-container">
            <img src="logo.png" alt="Rosa Logo" class="profile-img">
        </div>

        <h1 class="name">Rosa Makup</h1>

        <div class="btn-group">
            <a href="https://wa.me/9640000000000" class="btn" target="_blank">
                <i class="fab fa-whatsapp"></i> Whatsapp
            </a>
            <a href="https://www.facebook.com/" class="btn" target="_blank">
                <i class="fab fa-facebook-f"></i> Facebook
            </a>
            <a href="https://www.instagram.com/" class="btn" target="_blank">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="tel:07700000000" class="btn">
                <i class="fas fa-phone"></i> Call Al-Mansour
            </a>
            <a href="tel:07700000000" class="btn">
                <i class="fas fa-phone"></i> Call Al-Adhamiya
            </a>
        </div>

        <p class="footer-text">RosaMakupIQ❤️</p>
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), alpha: true, antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // 1. زيادة عدد النجوم وجعلها كروية الشكل
        const starsCount = 450;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starsCount * 3);

        for(let i = 0; i < starsCount * 3; i += 3) {
            starPos[i] = (Math.random() - 0.5) * 35;
            starPos[i+1] = (Math.random() - 0.5) * 35;
            starPos[i+2] = (Math.random() - 0.5) * 35;
        }

        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.09,
            transparent: true,
            opacity: 0.85
        });
        const starMesh = new THREE.Points(starGeo, starMat);
        scene.add(starMesh);

        // 2. زيادة عدد الأشكال الهندسية تسريع حركتها (28 شكل هندسي)
        const shapesGroup = new THREE.Group();
        const shapesCount = 28;
        const shapes = [];

        const purpleMaterial = new THREE.MeshBasicMaterial({
            color: 0xa855f7,
            wireframe: true,
            transparent: true,
            opacity: 0.5
        });

        for(let i = 0; i < shapesCount; i++) {
            const size = Math.random() * 0.75 + 0.35;
            const geo = Math.random() > 0.5 
                ? new THREE.IcosahedronGeometry(size, 0) 
                : new THREE.OctahedronGeometry(size, 0);

            const mesh = new THREE.Mesh(geo, purpleMaterial);
            
            mesh.position.set(
                (Math.random() - 0.5) * 22,
                (Math.random() - 0.5) * 22,
                (Math.random() - 0.5) * 15
            );

            mesh.rotation.set(
                Math.random() * Math.PI,
                Math.random() * Math.PI,
                Math.random() * Math.PI
            );

            // تسريع سرعة الدوران والحركة التفاعلية
            const speed = {
                rotX: (Math.random() - 0.5) * 0.035,
                rotY: (Math.random() - 0.5) * 0.035,
                moveY: (Math.random() - 0.5) * 0.015,
                moveX: (Math.random() - 0.5) * 0.015
            };

            shapes.push({ mesh, speed });
            shapesGroup.add(mesh);
        }
        scene.add(shapesGroup);

        camera.position.z = 10;

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            // تدوير مجرة النجوم بأكملها جهة اليسار (مثل الكرة الأرضية)
            starMesh.rotation.y += 0.003;

            // حركة وتدوير الأشكال الهندسية البنفسجية بسرعة أكبر
            shapes.forEach(item => {
                item.mesh.rotation.x += item.speed.rotX;
                item.mesh.rotation.y += item.speed.rotY;
                item.mesh.position.y += item.speed.moveY;
                item.mesh.position.x += item.speed.moveX;

                if(item.mesh.position.y > 12) item.mesh.position.y = -12;
                if(item.mesh.position.y < -12) item.mesh.position.y = 12;
                if(item.mesh.position.x > 12) item.mesh.position.x = -12;
                if(item.mesh.position.x < -12) item.mesh.position.x = 12;
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
