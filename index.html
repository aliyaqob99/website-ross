<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosa Makup</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #06040d;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-container {
            margin-bottom: 20px;
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: contain;
            border: 2px solid rgba(168, 85, 247, 0.7);
            background-color: #ffffff;
            padding: 4px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
        }

        .name {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .btn-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            width: 100%;
            padding: 15px 20px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(168, 85, 247, 0.25);
            border-color: #a855f7;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(168, 85, 247, 0.4);
        }

        /* إيماء اختفاء وظهور تدريجي للنص السفلي */
        .footer-text {
            font-size: 0.95rem;
            color: #d0d0e0;
            font-weight: 400;
            animation: pulseFade 3s ease-in-out infinite;
        }

        @keyframes pulseFade {
            0% {
                opacity: 0.15;
                transform: scale(0.96);
            }
            50% {
                opacity: 1;
                transform: scale(1.03);
                text-shadow: 0 0 12px rgba(168, 85, 247, 0.9);
            }
            100% {
                opacity: 0.15;
                transform: scale(0.96);
            }
        }
    </style>
</head>
<body>

    <canvas id="starCanvas"></canvas>

    <div class="container">
        <div class="profile-container">
            <img src="rosa-logo.png" alt="Rosa Logo" class="profile-img" onerror="this.style.display='none'">
        </div>

        <h1 class="name">Rosa Makup</h1>

        <div class="btn-group">
            <a href="https://wa.me/9640000000000" class="btn" target="_blank">
                <i class="fab fa-whatsapp"></i> Whatsapp
            </a>
            <a href="https://www.facebook.com/" class="btn" target="_blank">
                <i class="fab fa-facebook-f"></i> Facebook
            </a>
            <a href="https://www.instagram.com/" class="btn" target="_blank">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="tel:07700000000" class="btn">
                <i class="fas fa-phone"></i> Call Al-Mansour
            </a>
            <a href="tel:07700000000" class="btn">
                <i class="fas fa-phone"></i> Call Al-Adhamiya
            </a>
        </div>

        <p class="footer-text">RosaMakupIQ❤️</p>
    </div>

    <script>
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');

        let w, h;

        function setSize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        setSize();
        window.addEventListener('resize', setSize);

        // 1. توليد النجوم التي تتحرك لليسار
        const numStars = 300;
        const stars = [];

        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 1.3 + 0.3,
                speed: Math.random() * 0.4 + 0.1,
                alpha: Math.random() * 0.8 + 0.2
            });
        }

        // 2. توليد النيازك المضيئة الواقعية
        const meteors = [];

        function spawnMeteor() {
            meteors.push({
                x: Math.random() * (w + 200),
                y: Math.random() * (h * 0.4) - 50,
                len: Math.random() * 110 + 70,
                speed: Math.random() * 8 + 5,
                alpha: 1,
                size: Math.random() * 1.5 + 1
            });
        }

        setInterval(() => {
            if (meteors.length < 3 && Math.random() < 0.8) {
                spawnMeteor();
            }
        }, 1800);

        function draw() {
            ctx.clearRect(0, 0, w, h);

            // رسم وحركة النجوم أفقياً نحو اليسار
            for (let i = 0; i < stars.length; i++) {
                let s = stars[i];
                s.x -= s.speed;

                if (s.x < 0) {
                    s.x = w;
                    s.y = Math.random() * h;
                }

                ctx.fillStyle = rgba(255, 255, 255, ${s.alpha});
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            }

            // رسم النيازك الذكية ذات التوهج
            for (let i = meteors.length - 1; i >= 0; i--) {
                let m = meteors[i];

                m.x -= m.speed;
                m.y += m.speed * 0.5;
                m.alpha -= 0.008;

                if (m.alpha <= 0 || m.x < -150 || m.y > h + 150) {
                    meteors.splice(i, 1);
                    continue;
                }

                let tailX = m.x + m.len;
                let tailY = m.y - m.len * 0.5;

                let grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
                grad.addColorStop(0, rgba(255, 255, 255, ${m.alpha}));
                grad.addColorStop(0.3, rgba(192, 132, 252, ${m.alpha * 0.8}));
                grad.addColorStop(1, 'rgba(147, 51, 234, 0)');

                ctx.strokeStyle = grad;
                ctx.lineWidth = m.size;
                ctx.lineCap = 'round';

                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(tailX, tailY);
                ctx.stroke();

                // توهج رأس النيزك
                ctx.fillStyle = rgba(255, 255, 255, ${m.alpha});
                ctx.beginPath();
                ctx.arc(m.x, m.y, m.size * 1.2, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
