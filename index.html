<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosa Makup</title>

    <!-- استدعاء خط Poppins والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #06050e; /* نفس لون الخلفية الليلكي الداكن للفيديو */
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* حاوية جزيئات الخلفية المتحركة */
        #tsparticles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* الحاوية الرئيسية للمحتوى */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-container {
            margin-bottom: 20px;
        }

        /* اللوكو الدائري بالإطار المضيء */
        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: contain;
            border: 2px solid rgba(168, 85, 247, 0.7);
            background-color: #ffffff;
            padding: 4px;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
        }

        .name {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        /* الأزرار الزجاجية الشفافة */
        .btn-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            width: 100%;
            padding: 15px 20px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: #a855f7;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(168, 85, 247, 0.4);
        }

        .footer-text {
            font-size: 0.95rem;
            color: #d0d0e0;
            font-weight: 400;
        }
    </style>

    <!-- استدعاء مكتبة tsparticles الرسمية والخفيفة للحركات الهندسية -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-engine@2.12.0/tsparticles.engine.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-basic@2.12.0/tsparticles.basic.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-shape-polygon@2.12.0/tsparticles.shape.polygon.min.js"></script>
</head>
<body>

    <!-- حاوية محرك الجزيئات والأشكال -->
    <div id="tsparticles"></div>

    <!-- محتوى الصفحة -->
    <div class="container">
        
        <div class="profile-container">
            <img src="logo.png" alt="Rosa Logo" class="profile-img">
        </div>

        <h1 class="name">Rosa Makup</h1>

        <div class="btn-group">
            <a href="https://wa.me/9640000000000" class="btn" target="_blank">
                <i class="fab fa-whatsapp"></i> Whatsapp
            </a>
            <a href="https://www.facebook.com/" class="btn" target="_blank">
                <i class="fab fa-facebook-f"></i> Facebook
            </a>
            <a href="https://www.instagram.com/" class="btn" target="_blank">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="tel:07700000000" class="btn">
                <i class="fas fa-phone"></i> Call 
            </a>
            
        </div>

        <p class="footer-text">RosaMakupIQ❤️</p>
    </div>

    <!-- برمجة وحركة الأشكال والنجوم تماماً كالفيديو -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await tsParticles.load("tsparticles", {
                fpsLimit: 60,
                particles: {
                    number: {
                        value: 25, /* عدد الأشكال والنجوم */
                        density: { enable: true, area: 800 }
                    },
                    color: {
                        value: ["#ffffff", "#8b5cf6", "#a855f7"] /* ألوان الأشكال البنفسجية والأبيض */
                    },
                    shape: {
                        type: ["circle", "polygon"], /* دمج النجوم والأشكال الهندسية */
                        options: {
                            polygon: [
                                { sides: 6 }, /* شكل سداسي كريستالي */
                                { sides: 4 }  /* شكل معيّن هندسي */
                            ]
                        }
                    },
                    opacity: {
                        value: { min: 0.15, max: 0.6 },
                        animation: {
                            enable: true,
                            speed: 1,
                            sync: false
                        }
                    },
                    size: {
                        value: { min: 3, max: 22 }, /* مقاسات متفاوتة للأشكال */
                        animation: {
                            enable: true,
                            speed: 2,
                            sync: false
                        }
                    },
                    rotate: {
                        value: { min: 0, max: 360 },
                        direction: "random",
                        animation: {
                            enable: true,
                            speed: 4 /* حركة دوران الأشكال الهندسية */
                        }
                    },
                    move: {
                        enable: true,
                        speed: 0.8, /* سرعة الطوفان الهادئة والسلسة */
                        direction: "none",
                        random: true,
                        straight: false,
                        outModes: { default: "out" }
                    }
                },
                detectRetina: true
            });
        });
    </script>

</body>
</html>
