<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosa Makup</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #06040d;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-container {
            margin-bottom: 20px;
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: contain;
            border: 2px solid rgba(168, 85, 247, 0.7);
            background-color: #ffffff;
            padding: 4px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
        }

        .name {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .btn-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            width: 100%;
            padding: 15px 20px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(168, 85, 247, 0.25);
            border-color: #a855f7;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(168, 85, 247, 0.4);
        }

        .footer-text {
            font-size: 0.95rem;
            color: #d0d0e0;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="container">
        <div class="profile-container">
            <img src="logo.png" alt="Rosa Logo" class="profile-img">
        </div>

        <h1 class="name">Rosa Makup</h1>

        <div class="btn-group">
            <a href="https://wa.me/9640000000000" class="btn" target="_blank">
                <i class="fab fa-whatsapp"></i> Whatsapp
            </a>
            <a href="https://www.facebook.com/" class="btn" target="_blank">
                <i class="fab fa-facebook-f"></i> Facebook
            </a>
            <a href="https://www.instagram.com/" class="btn" target="_blank">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="tel:07700000000" class="btn">
                <i class="fas fa-phone"></i> Call Al-Mansour
            </a>
            <a href="tel:07700000000" class="btn">
                <i class="fas fa-phone"></i> Call Al-Adhamiya
            </a>
        </div>

        <p class="footer-text">RosaMakupIQ❤️</p>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');

            let width, height;

            function initCanvas() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            initCanvas();
            window.addEventListener('resize', initCanvas);

            // 1. توليد نجوم تحرك لليسار بسرعات هادئة
            const numStars = 250;
            const stars = [];

            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.4 + 0.3,
                    alpha: Math.random() * 0.8 + 0.2,
                    speed: Math.random() * 0.3 + 0.1, // سرعة هادئة وبطيئة جداً
                    twinkleSpeed: Math.random() * 0.01 + 0.005
                });
            }

            // 2. كائنات النيازك والشهب الاحترافية
            const meteors = [];

            function spawnMeteor() {
                meteors.push({
                    x: Math.random() * width + 200,
                    y: Math.random() * (height * 0.6) - 100,
                    length: Math.random() * 80 + 50,
                    speed: Math.random() * 6 + 4,
                    size: Math.random() * 1.5 + 1,
                    alpha: 1
                });
            }

            // إطلاق شهاب كل بضع ثوانٍ
            setInterval(() => {
                if (Math.random() < 0.7) {
                    spawnMeteor();
                }
            }, 2500);

            function animate() {
                ctx.clearRect(0, 0, width, height);

                // --- رسم وحركة النجوم لليسار ---
                stars.forEach(star => {
                    star.x -= star.speed; // التحرك نحو اليسار

                    // إعادة النجمة لليمين عند خروجها من يسار الشاشة
                    if (star.x < 0) {
                        star.x = width;
                        star.y = Math.random() * height;
                    }

                    // تأثير اللمعان البسيط
                    star.alpha += Math.sin(Date.now() * star.twinkleSpeed) * 0.005;
                    const opacity = Math.min(Math.max(star.alpha, 0.2), 0.9);

                    ctx.fillStyle = rgba(255, 255, 255, ${opacity});
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fill();
                });

                // --- رسم النيازك مع التدرج المضيء ---
                for (let i = meteors.length - 1; i >= 0; i--) {
                    const m = meteors[i];

                    // حركة النيزك بزاوية مائلة نحو الأسفل واليسار
                    m.x -= m.speed;
                    m.y += m.speed * 0.5;
                    m.alpha -= 0.008;

                    if (m.alpha <= 0 || m.x < -100 || m.y > height + 100) {
                        meteors.splice(i, 1);
                        continue;
                    }

                    // حساب رأس وذيل النيزك
                    const tailX = m.x + m.length;
                    const tailY = m.y - m.length * 0.5;

                    const gradient = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
                    gradient.addColorStop(0, rgba(255, 255, 255, ${m.alpha}));
                    gradient.addColorStop(0.3, rgba(192, 132, 252, ${m.alpha * 0.8}));
                    gradient.addColorStop(1, 'rgba(192, 132, 252, 0)');

                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = m.size;
                    ctx.lineCap = 'round';

                    ctx.beginPath();
                    ctx.moveTo(m.x, m.y);
                    ctx.lineTo(tailX, tailY);
                    ctx.stroke();

                    // رأس النيزك المضيء
                    ctx.fillStyle = rgba(255, 255, 255, ${m.alpha});
                    ctx.beginPath();
                    ctx.arc(m.x, m.y, m.size * 1.2, 0, Math.PI * 2);
                    ctx.fill();
                }

                requestAnimationFrame(animate);
            }

            animate();
        })();
    </script>
</body>
</html>
