<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosa Makup</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #080612;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-container {
            margin-bottom: 20px;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: contain;
            border: 2px solid rgba(168, 85, 247, 0.7);
            background-color: #ffffff;
            padding: 4px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
        }

        .name {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .btn-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            width: 100%;
            padding: 15px 20px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(168, 85, 247, 0.25);
            border-color: #a855f7;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(168, 85, 247, 0.4);
        }

        .footer-text {
            font-size: 0.95rem;
            color: #d0d0e0;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="container">
        <div class="profile-container">
            <img src="logo.png" alt="Rosa Logo" class="profile-img">
        </div>

        <h1 class="name">Rosa Makup</h1>

        <div class="btn-group">
            <a href="https://wa.me/9640000000000" class="btn" target="_blank">
                <i class="fab fa-whatsapp"></i> Whatsapp
            </a>
            <a href="https://www.facebook.com/" class="btn" target="_blank">
                <i class="fab fa-facebook-f"></i> Facebook
            </a>
            <a href="https://www.instagram.com/" class="btn" target="_blank">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="tel:07700000000" class="btn">
                <i class="fas fa-phone"></i> Call Al-Mansour
            </a>
            <a href="tel:07700000000" class="btn">
                <i class="fas fa-phone"></i> Call Al-Adhamiya
            </a>
        </div>

        <p class="footer-text">RosaMakupIQ❤️</p>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            // 1. النجوم البيضاء المضيئة
            const stars = Array.from({ length: 120 }, () => ({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 1.8 + 0.3,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.005
            }));

            // 2. الأشكال الهندسية ثلاثية الأبعاد (مكعبات وبلورات بنفسجية)
            const shapes = Array.from({ length: 18 }, () => ({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 25 + 15,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                angle: Math.random() * Math.PI * 2,
                vRot: (Math.random() - 0.5) * 0.012,
                type: Math.floor(Math.random() * 3)
            }));

            // رسم مكعب ثلاثي الأبعاد شبيهاً بالفيديو
            function drawCube(c, size) {
                c.beginPath();
                // المضلع الخارجي
                for (let i = 0; i < 6; i++) {
                    const a = (Math.PI / 3) * i;
                    const x = size * Math.cos(a);
                    const y = size * Math.sin(a);
                    if (i === 0) c.moveTo(x, y);
                    else c.lineTo(x, y);
                }
                c.closePath();
                c.stroke();

                // خطوط الأبعاد الداخلية للمكعب
                c.beginPath();
                c.moveTo(0, 0); c.lineTo(0, size);
                c.moveTo(0, 0); c.lineTo(size * Math.cos(Math.PI / 6), -size * Math.sin(Math.PI / 6));
                c.moveTo(0, 0); c.lineTo(-size * Math.cos(Math.PI / 6), -size * Math.sin(Math.PI / 6));
                c.stroke();
            }

            // رسم أشكال معينة وهندسية متداخلة
            function drawIcoShape(c, size) {
                c.beginPath();
                c.moveTo(0, -size);
                c.lineTo(size * 0.8, -size * 0.3);
                c.lineTo(size * 0.8, size * 0.5);
                c.lineTo(0, size);
                c.lineTo(-size * 0.8, size * 0.5);
                c.lineTo(-size * 0.8, -size * 0.3);
                c.closePath();
                c.stroke();

                c.beginPath();
                c.moveTo(0, -size); c.lineTo(0, size);
                c.moveTo(-size * 0.8, -size * 0.3); c.lineTo(size * 0.8, size * 0.5);
                c.moveTo(size * 0.8, -size * 0.3); c.lineTo(-size * 0.8, size * 0.5);
                c.stroke();
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // رسم النجوم
                stars.forEach(st => {
                    st.alpha += st.speed;
                    if (st.alpha > 1 || st.alpha < 0) st.speed = -st.speed;
                    ctx.fillStyle = 'rgba(255, 255, 255, ' + Math.abs(st.alpha) + ')';
                    ctx.beginPath();
                    ctx.arc(st.x, st.y, st.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                // رسم الأشكال ثلاثية الأبعاد
                shapes.forEach(sp => {
                    sp.x += sp.vx;
                    sp.y += sp.vy;
                    sp.angle += sp.vRot;

                    if (sp.x < -50) sp.x = canvas.width + 50;
                    if (sp.x > canvas.width + 50) sp.x = -50;
                    if (sp.y < -50) sp.y = canvas.height + 50;
                    if (sp.y > canvas.height + 50) sp.y = -50;

                    ctx.save();
                    ctx.translate(sp.x, sp.y);
                    ctx.rotate(sp.angle);
                    
                    // لون الخطوط والبريق التلقائي
                    ctx.strokeStyle = 'rgba(168, 85, 247, 0.6)';
                    ctx.lineWidth = 1.2;
                    ctx.shadowColor = '#a855f7';
                    ctx.shadowBlur = 10;

                    if (sp.type === 0) drawCube(ctx, sp.size);
                    else drawIcoShape(ctx, sp.size);

                    ctx.restore();
                });

                requestAnimationFrame(animate);
            }

            animate();
        })();
    </script>
</body>
</html>
