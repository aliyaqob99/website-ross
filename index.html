<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rosa Makeup</title>

<!-- Icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    font-family:Arial, sans-serif;
    color:#fff;
    background:
      radial-gradient(circle at 50% 15%, #3b123f 0%, transparent 30%),
      radial-gradient(circle at 90% 55%, #321238 0%, transparent 28%),
      radial-gradient(circle at 10% 75%, #111c3b 0%, transparent 30%),
      #080914;
}

/* ================= BACKGROUND ================= */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:-2;
}

.background::before{
    content:"";
    position:absolute;
    width:700px;
    height:700px;
    border-radius:50%;
    background:#c52c9c;
    filter:blur(180px);
    opacity:.15;
    top:-300px;
    left:-250px;
    animation:aurora 8s infinite alternate ease-in-out;
}

.background::after{
    content:"";
    position:absolute;
    width:600px;
    height:600px;
    border-radius:50%;
    background:#6e4cff;
    filter:blur(180px);
    opacity:.13;
    right:-250px;
    bottom:-250px;
    animation:aurora2 10s infinite alternate ease-in-out;
}

@keyframes aurora{
    from{transform:translate(0,0)}
    to{transform:translate(150px,180px)}
}

@keyframes aurora2{
    from{transform:translate(0,0)}
    to{transform:translate(-150px,-100px)}
}

/* ================= STARS ================= */

.stars{
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
}

.star{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 10px white, 0 0 20px #ff8be8;
    animation:twinkle 2s infinite ease-in-out alternate,
              drift 12s infinite linear;
}

.star.big{
    width:7px;
    height:7px;
}

@keyframes twinkle{
    from{
        opacity:.15;
        transform:scale(.5);
    }
    to{
        opacity:1;
        transform:scale(1.5);
    }
}

@keyframes drift{
    from{margin-left:0}
    to{margin-left:-90px}
}

/* ================= MAIN ================= */

.container{
    width:100%;
    max-width:680px;
    margin:auto;
    padding:35px 22px 30px;
    text-align:center;
}

/* ================= LOGO ================= */

.logo-wrap{
    position:relative;
    width:205px;
    height:205px;
    margin:0 auto 27px;
}

.logo{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    border:4px solid rgba(255,255,255,.12);
    box-shadow:
        0 0 0 4px rgba(255,80,210,.10),
        0 0 35px rgba(255,50,190,.35),
        0 0 90px rgba(180,50,255,.18);
    animation:logoFloat 4s ease-in-out infinite;
}

.logo-ring{
    position:absolute;
    inset:-10px;
    border-radius:50%;
    border:1px solid rgba(255,91,221,.45);
    animation:spin 12s linear infinite;
}

.logo-ring::after{
    content:"✦";
    position:absolute;
    top:-10px;
    left:50%;
    color:#ff9be9;
    font-size:18px;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@keyframes logoFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-7px)}
}

/* ================= TITLE ================= */

.category{
    letter-spacing:6px;
    font-size:14px;
    color:#ddd1df;
    margin-bottom:27px;
}

h1{
    font-family:Georgia, serif;
    font-size:52px;
    margin-bottom:14px;
    background:linear-gradient(90deg,#fff,#ffd9f7,#fff);
    -webkit-background-clip:text;
    color:transparent;
    text-shadow:0 0 30px rgba(255,100,220,.15);
}

.subtitle{
    color:#aaa7b4;
    font-size:21px;
    margin-bottom:45px;
}

/* ================= BUTTONS ================= */

.links{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.link{
    position:relative;
    height:116px;
    border-radius:28px;

    display:flex;
    align-items:center;

    padding:0 24px;

    text-decoration:none;
    color:white;

    background:
      linear-gradient(
        100deg,
        rgba(255,255,255,.07),
        rgba(255,255,255,.025)
      );

    border:1px solid rgba(255,255,255,.13);

    box-shadow:
      inset 0 1px rgba(255,255,255,.08),
      0 15px 45px rgba(0,0,0,.25);

    backdrop-filter:blur(18px);

    overflow:hidden;

    transition:
      transform .35s ease,
      border-color .35s ease,
      box-shadow .35s ease;
}

/* pink glow moving left */

.link::before{
    content:"";
    position:absolute;
    width:220px;
    height:160%;
    left:55%;
    top:-30%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,40,190,.20),
        transparent
    );
    filter:blur(25px);
    transform:translateX(0);
    animation:lightMove 5s infinite ease-in-out;
}

@keyframes lightMove{
    0%{
        transform:translateX(180px);
    }
    50%{
        transform:translateX(-260px);
    }
    100%{
        transform:translateX(180px);
    }
}

.link:hover{
    transform:translateX(-8px);
    border-color:rgba(255,82,213,.55);

    box-shadow:
      0 15px 50px rgba(255,30,190,.15),
      inset 0 0 25px rgba(255,50,210,.06);
}

/* ================= ICON ================= */

.icon{
    position:relative;
    z-index:2;

    min-width:65px;
    height:65px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:21px;

    margin-left:0;
    margin-right:25px;

    font-size:31px;

    background:
      linear-gradient(
        145deg,
        rgba(255,255,255,.18),
        rgba(255,255,255,.04)
      );

    border:1px solid rgba(255,255,255,.16);

    box-shadow:
      inset 0 1px rgba(255,255,255,.15),
      0 0 25px rgba(255,40,200,.10);

    transition:.35s;
}

.link:hover .icon{
    transform:translateX(-10px) rotate(-5deg) scale(1.08);
    box-shadow:
      0 0 30px rgba(255,70,210,.35);
}

/* WhatsApp */

.whatsapp .icon{
    color:#25D366;
}

/* Facebook */

.facebook .icon{
    color:#5b8cff;
}

/* Instagram */

.instagram .icon{
    color:#ff5fbe;
}

/* Phone */

.phone .icon{
    color:#e8a6ff;
}

.text{
    position:relative;
    z-index:2;

    font-size:27px;
    font-weight:600;

    flex:1;
    text-align:left;

    transition:.35s;
}

.link:hover .text{
    transform:translateX(-7px);
}

.arrow{
    position:relative;
    z-index:2;

    width:44px;
    height:44px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(255,255,255,.22);

    color:#ddd;

    transition:.35s;
}

.link:hover .arrow{
    transform:translateX(-8px);
    background:rgba(255,50,210,.14);
    border-color:#ff72db;
}

/* ================= FOOTER ================= */

.brand{
    display:inline-flex;
    align-items:center;
    gap:12px;

    margin-top:45px;
    padding:15px 25px;

    border-radius:40px;

    color:#aaa5b2;

    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.08);

    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#ff55bd;
    box-shadow:0 0 15px #ff55bd;
}

.heart{
    color:#ff5fbe;
    font-size:22px;
}

footer{
    margin-top:28px;
    color:#666474;
    font-size:14px;
    letter-spacing:1px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .container{
        padding:25px 16px;
    }

    .logo-wrap{
        width:190px;
        height:190px;
    }

    h1{
        font-size:43px;
    }

    .category{
        font-size:12px;
        letter-spacing:4px;
    }

    .subtitle{
        font-size:18px;
        margin-bottom:35px;
    }

    .link{
        height:100px;
        border-radius:25px;
        padding:0 17px;
    }

    .icon{
        min-width:57px;
        height:57px;
        border-radius:18px;
        margin-right:18px;
        font-size:27px;
    }

    .text{
        font-size:22px;
    }

    .arrow{
        width:38px;
        height:38px;
    }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="stars" id="stars"></div>

<main class="container">

    <!-- LOGO -->
    <div class="logo-wrap">
        <div class="logo-ring"></div>

        <!-- خلي اسم صورة شعارك logo.png -->
        <img src="logo.png" class="logo" alt="Rosa Makeup">
    </div>

    <div class="category">
        BEAUTY • MAKEUP • PERFUMES
    </div>

    <h1>Rosa Makeup</h1>

    <div class="subtitle">
        Everything beautiful, in one place.
    </div>


    <!-- LINKS -->
    <div class="links">

        <!-- WHATSAPP -->
        <a class="link whatsapp"
           href="https://wa.me/964XXXXXXXXXX"
           target="_blank">

            <div class="icon">
                <i class="fa-brands fa-whatsapp"></i>
            </div>

            <div class="text">
                WhatsApp
            </div>

            <div class="arrow">
                <i class="fa-solid fa-arrow-left"></i>
            </div>
        </a>


        <!-- FACEBOOK -->
        <a class="link facebook"
           href="https://facebook.com/"
           target="_blank">

            <div class="icon">
                <i class="fa-brands fa-facebook-f"></i>
            </div>

            <div class="text">
                Facebook
            </div>

            <div class="arrow">
                <i class="fa-solid fa-arrow-left"></i>
            </div>
        </a>


        <!-- INSTAGRAM -->
        <a class="link instagram"
           href="https://instagram.com/"
           target="_blank">

            <div class="icon">
                <i class="fa-brands fa-instagram"></i>
            </div>

            <div class="text">
                Instagram
            </div>

            <div class="arrow">
                <i class="fa-solid fa-arrow-left"></i>
            </div>
        </a>


        <!-- AL-MANSOUR -->
        <a class="link phone"
           href="tel:+964XXXXXXXXXX">

            <div class="icon">
                <i class="fa-solid fa-phone"></i>
            </div>

            <div class="text">
                Call Al-Mansour
            </div>

            <div class="arrow">
                <i class="fa-solid fa-arrow-left"></i>
            </div>
        </a>

    </div>


    <div class="brand">
        <span class="dot"></span>
        <span>Rosa Makeup IQ</span>
        <span class="heart">♥</span>
    </div>

    <footer>
        © 2026 Rosa Makeup • Baghdad
    </footer>

</main>


<script>

/* =========================================
   CREATE MANY MOVING STARS
========================================= */

const stars = document.getElementById("stars");

for(let i = 0; i < 75; i++){

    const star = document.createElement("span");

    star.className =
        "star" + (Math.random() > .82 ? " big" : "");

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.animationDelay =
        Math.random() * 5 + "s";

    star.style.animationDuration =
        (2 + Math.random() * 5) + "s, " +
        (8 + Math.random() * 10) + "s";

    stars.appendChild(star);
}


/* =========================================
   CLICK EFFECT
========================================= */

document.querySelectorAll(".link").forEach(link => {

    link.addEventListener("click", function(){

        this.style.transform = "translateX(-12px) scale(.98)";

        setTimeout(() => {
            this.style.transform = "";
        }, 180);

    });

});

</script>

</body>
</html>
