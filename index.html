<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosa Makup</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #06040d;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-container {
            margin-bottom: 20px;
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: contain;
            border: 2px solid rgba(168, 85, 247, 0.7);
            background-color: #ffffff;
            padding: 4px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
        }

        .name {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .btn-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            width: 100%;
            padding: 15px 20px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(168, 85, 247, 0.25);
            border-color: #a855f7;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(168, 85, 247, 0.4);
        }

        .footer-text {
            font-size: 0.95rem;
            color: #d0d0e0;
            font-weight: 400;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div class="container">
        <div class="profile-container">
            <img src="logo.png" alt="Rosa Logo" class="profile-img">
        </div>

        <h1 class="name">Rosa Makup</h1>

        <div class="btn-group">
            <a href="https://wa.me/9640000000000" class="btn" target="_blank">
                <i class="fab fa-whatsapp"></i> Whatsapp
            </a>
            <a href="https://www.facebook.com/" class="btn" target="_blank">
                <i class="fab fa-facebook-f"></i> Facebook
            </a>
            <a href="https://www.instagram.com/" class="btn" target="_blank">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="tel:07700000000" class="btn">
                <i class="fas fa-phone"></i> Call Al-Mansour
            </a>
            <a href="tel:07700000000" class="btn">
                <i class="fas fa-phone"></i> Call Al-Adhamiya
            </a>
        </div>

        <p class="footer-text">RosaMakupIQ❤️</p>
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), alpha: true, antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // 1. إنشاء حقل النجوم المضيئة
        const starsCount = 600;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starsCount * 3);

        for(let i = 0; i < starsCount * 3; i += 3) {
            starPos[i] = (Math.random() - 0.5) * 40;
            starPos[i+1] = (Math.random() - 0.5) * 40;
            starPos[i+2] = (Math.random() - 0.5) * 40;
        }

        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.08,
            transparent: true,
            opacity: 0.85
        });
        const starMesh = new THREE.Points(starGeo, starMat);
        scene.add(starMesh);

        // 2. إنشاء النيازك والشهب المتساقطة المضيئة
        const meteors = [];
        const meteorMat = new THREE.LineBasicMaterial({
            color: 0xebd5ff,
            transparent: true,
            opacity: 0.8
        });

        function createMeteor() {
            const geometry = new THREE.BufferGeometry();
            const points = [
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(-1.2, 0.6, -0.4) // ذيل الشهاب
            ];
            geometry.setFromPoints(points);

            const line = new THREE.Line(geometry, meteorMat);
            line.position.set(
                Math.random() * 30 - 10,
                Math.random() * 20 + 5,
                (Math.random() - 0.5) * 10
            );

            scene.add(line);
            meteors.push({
                mesh: line,
                speedX: -0.25 - Math.random() * 0.15,
                speedY: -0.15 - Math.random() * 0.1
            });
        }

        // إطلاق نيزك كل فترة زمنية
        setInterval(() => {
            if (meteors.length < 5) {
                createMeteor();
            }
        }, 1200);

        camera.position.z = 10;

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            // دوران شبكة النجوم نحو اليسار مثل دوران الأرض
            starMesh.rotation.y += 0.0035;

            // تحريك النيازك واختفائها عند الخروج من الشاشة
            for (let i = meteors.length - 1; i >= 0; i--) {
                const m = meteors[i];
                m.mesh.position.x += m.speedX;
                m.mesh.position.y += m.speedY;

                if (m.mesh.position.x < -20 || m.mesh.position.y < -15) {
                    scene.remove(m.mesh);
                    m.mesh.geometry.dispose();
                    meteors.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
